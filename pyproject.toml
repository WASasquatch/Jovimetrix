[project]
name = "jovimetrix"
description = "Animation via tick. Parameter manipulation with wave generator. Unary and Binary math support. Value convert int/float/bool, VectorN and Image, Mask types. Shape mask generator. Stack images, do channel ops, split, merge and randomize arrays and batches. Load images and video from your folders. Dynamic bus routing. Flatten, crop, transform; check colorblindness or linear interpolate values."
version = "3.0.0"
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "Alexander G. Morano", email = "amorano@gmail.com" }, {name = "Jordan Thompson (WASasquatch)", email = "was@wasasquatch.io"}]
maintainers = [{ name = "Jordan Thompson (WASasquatch)" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
]
requires-python = ">=3.10"
dependencies = [
    "blendmodes",
    "daltonlens",
    "opencv-contrib-python",
]

[project.urls]
Homepage = "https://github.com/WASasquatch/Jovimetrix"
Documentation = "https://github.com/WASasquatch/Jovimetrix/blob/main/NODES.md"
Repository = "https://github.com/WASasquatch/Jovimetrix"
Issues = "https://github.com/WASasquatch/Jovimetrix/issues"

[tool.comfy]
PublisherId = "was"
DisplayName = "Jovimetrix (WAS Fork)"
Icon = "https://raw.githubusercontent.com/WASasquatch/Jovimetrix/refs/heads/main/logo-jvmx.png"
web = "web"
requires-comfyui = ">=0.14.0"
